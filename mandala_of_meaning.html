    #mandala-wrap4 svg text { font-family:'MoM Runic','MoM Ogham','MoM Glagolitic','MoM Coptic','MoM Cherokee','MoM Canadian','MoM Tifinagh','MoM Vai','MoM Bamum','MoM Yi','MoM Music','MoM Symbols2','MoM Symbols','MoM Math','MoM NotoSans','MoM DejaVu',serif; }
    #ticker-text { font-family:'MoM Runic','MoM Ogham','MoM Glagolitic','MoM Coptic','MoM Cherokee','MoM Canadian','MoM Tifinagh','MoM Vai','MoM Bamum','MoM Yi','MoM Music','MoM Symbols2','MoM Symbols','MoM Math','MoM NotoSans','MoM DejaVu',monospace; }
    #mandala-wrap4 { --bpm: 80; }
    #known-ring-group {
      transform-box: fill-box; transform-origin: center;
      animation: spin-cw calc(18s * 80 / var(--bpm)) linear infinite;
    }
    #spiral-group {
      transform-box: fill-box; transform-origin: center;
      animation: spin-ccw calc(140s * 80 / var(--bpm)) linear infinite;
    }
    @keyframes spin-cw  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    #pulse-core {
      transform-box: fill-box; transform-origin: center;
      animation: pulse-beat calc(60s / var(--bpm)) ease-in-out infinite;
    }
    @keyframes pulse-beat {
      0%   { transform: scale(1);    opacity: 0.93; }
      35%  { transform: scale(1.06); opacity: 1;    }
      100% { transform: scale(1);    opacity: 0.93; }
    }
    #mandala-wrap4.paused #known-ring-group,
    #mandala-wrap4.paused #spiral-group,
    #mandala-wrap4.paused #pulse-core {
      animation-play-state: paused;
    }
